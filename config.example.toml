[telegram]
token = "PUT_BOTFATHER_TOKEN_HERE"
greeting_parse_mode = "HTML"
greeting = """
<b>Привет!</b>

Спасибо, что откликнулся и готов поделиться своими воспоминаниями!

Мы собираем самые яркие, тёплые и незабываемые моменты, связанные с BETBOOM. И нам очень нужна твоя помощь!

Здесь ты можешь поделиться любыми фотографиями и видео: от рабочих будней и корпоративных мероприятий до забавных ситуаций и моментов, которые хочется вспоминать снова и снова.

<b>Что можно загрузить?</b>
Неограниченное количество фотографий.
Неограниченное количество видеороликов размером до 500 МБ каждый.

<b>Не стесняйся делиться!</b> Даже самый обычный на первый взгляд кадр может оказаться частью большой и классной истории

Если возникнут вопросы, обращайся к специалисту по корпоративной культуре и внутренним коммуникациям — <b>User</b> (@nikuser).

<b>Спасибо, что готов поделиться частичкой своей истории!</b> ❤️
"""
# Пустой список разрешает всем. Иначе укажите числовые Telegram ID.
allowed_user_ids = []
# Для скачивания >20 MB нужен отдельный Telegram Bot API server с --local.
# Инструкция настройки находится в README. Пустой URL = облачный API Telegram.
local_api_url = ""
local_file_root = "/var/lib/telegram-bot-api"

[storage]
# Любое положительное целое число. Для >20 MB настройте local_api_url.
max_file_mb = 20
# Загрузка последовательно; временные файлы удаляются после обработки.
directory = "/var/lib/botimagessave/media"
# Минимум свободного места, оставляемый на диске (MB).
min_free_mb = 1024
